{% extends 'base.html' %}
{% block title %}403 - Access Restricted{% endblock %}

{% block content %}
<div class="empty-state-card py-5">
    <div class="empty-icon-circle text-danger">
        <i class="bi bi-shield-x"></i>
    </div>
    <h2 class="empty-state-title">Access Restricted</h2>
    <p class="empty-state-desc">You do not possess the required academic administrative role to access this portal.</p>
    <a href="{{ url_for('dashboard.dashboard_view') }}" class="btn-primary-gradient">
        <i class="bi bi-house-door me-1"></i> Return to Student Dashboard
    </a>
</div>
{% endblock %}
