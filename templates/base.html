<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillGuide</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
{% block head %}{% endblock %}
</head>
<body>
<div class="app">
<aside>
<div class="brand">◉ SkillGuide</div>
<nav>
<a class="{{'active' if page=='dashboard' else ''}}" href="{{url_for('dashboard')}}">⌂ <span>Dashboard</span></a>
<a class="{{'active' if page=='assessment' else ''}}" href="{{url_for('assessment')}}">✓ <span>Assessment</span></a>
<a href="{{url_for('assessment')}}#skills">◇ <span>Skills</span></a>
<a class="{{'active' if page=='career' else ''}}" href="{{url_for('career')}}">⌁ <span>Career</span></a>
<a class="{{'active' if page=='skill-swap' else ''}}" href="{{url_for('skill_swap')}}">♧ <span>Skill Swap</span></a>
<a class="{{'active' if page=='skill-swap' else ''}}" href="{{url_for('skill_swap')}}#map">⌖ <span>Map</span></a>
<a href="{{url_for('skill_swap')}}#badge">♢ <span>Badges</span></a>
<a class="{{'active' if page=='profile' else ''}}" href="{{url_for('profile')}}">♙ <span>Profile</span></a>
<a href="{{url_for('logout')}}">↪ <span>Logout</span></a>
</nav>
<div class="points">🏆<span>Skill Points<strong>120</strong></span></div>
</aside>
<main>
<header>Welcome, <b>{{user['name']}}</b> <span class="avatar">{{user['name'][0]|upper}}</span></header>
{% block content %}{% endblock %}
</main>
</div>
<script src="{{url_for('static',filename='app.js')}}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
