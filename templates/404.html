{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="empty-state-card py-5">
    <div class="empty-icon-circle text-warning">
        <i class="bi bi-question-circle"></i>
    </div>
    <h2 class="empty-state-title">Page Not Found</h2>
    <p class="empty-state-desc">The requested resource could not be found on SkillGuide. Check the URL or return to your student dashboard.</p>
    <a href="{{ url_for('dashboard.dashboard_view') }}" class="btn-primary-gradient">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
